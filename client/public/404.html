<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScribeSnap.ai | Page Not Found</title>
    <meta name="description" content="The page you requested could not be found." />
    <style>
      :root {
        --bg: #F6F2EA;
        --surface: #FBF7F0;
        --ink: #1D1D1F;
        --muted: #5A5960;
        --border: #E5DDCF;
        --blue-light: #7BD3FF;
        --blue-main: #3C8CFF;
        --blue-deep: #1F6BFF;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 45% at 50% 0%, rgba(123, 211, 255, 0.28) 0%, rgba(123, 211, 255, 0) 70%),
          linear-gradient(145deg, rgba(60, 140, 255, 0.08), rgba(31, 107, 255, 0.03)),
          var(--bg);
      }

      .wrap {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(720px, 100%);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: 0 16px 48px rgba(29, 29, 31, 0.09);
        padding: 40px 34px;
        text-align: center;
      }

      .logo {
        width: min(300px, 88%);
        height: auto;
        display: block;
        margin: 0 auto 24px;
      }

      .code {
        margin: 0;
        font-size: clamp(52px, 12vw, 88px);
        line-height: 0.95;
        letter-spacing: -0.05em;
        font-weight: 800;
        background: linear-gradient(90deg, var(--blue-light), var(--blue-main), var(--blue-deep));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 {
        margin: 10px 0 10px;
        font-size: clamp(24px, 5vw, 34px);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 auto 24px;
        max-width: 52ch;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 42px;
        border-radius: 11px;
        padding: 0 16px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        border: 1px solid var(--border);
      }

      .btn-primary {
        color: #fff;
        border-color: transparent;
        background: linear-gradient(90deg, var(--blue-main), var(--blue-deep));
      }

      .btn-secondary {
        color: var(--ink);
        background: #fff;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <img class="logo" src="/logo-wordmark.png" alt="ScribeSnap" />
        <p class="code">404</p>
        <h1>This page does not exist</h1>
        <p>
          The link may be outdated, mistyped, or the page may have moved.
          Return to the main page and continue extracting transcripts.
        </p>
        <div class="actions">
          <a class="btn btn-primary" href="/">Go to Home</a>
          <a class="btn btn-secondary" href="https://scribesnap.ai">Open ScribeSnap.ai</a>
        </div>
      </section>
    </main>
  </body>
</html>
